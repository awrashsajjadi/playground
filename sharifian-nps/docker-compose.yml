# VPS deployment: the app behind Caddy, which gets and renews the HTTPS certificate by itself.
#   1. cp .env.example .env   and fill it in (DOMAIN too, if it is not nazar.sharifianshop.com)
#   2. point the domain's DNS A record at this server
#   3. docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/nps.db
      TRUST_PROXY: "1" # exactly one proxy (Caddy) in front: the client IP is the address Caddy saw (D11)
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-nazar.sharifianshop.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
